name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm run build
      # healthy sample passes 4 scenarios; broken samples fail at expected phases; repeated to catch flakiness
      - run: npx playwright test tests/ --repeat-each=3
      # installs the packed tarball into a clean project and runs the quick start
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: offline-check-evidence
          path: offline-check-results/
          retention-days: 3
